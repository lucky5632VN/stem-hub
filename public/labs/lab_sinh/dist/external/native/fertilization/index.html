<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Thụ tinh</title>
    <style>
        html {overflow: auto;} 
        html, body {
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            overflow: hidden; 
            background: radial-gradient(circle, #2c3e50 0%, #000000 100%);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
        } 
        canvas {
            display: block; 
            touch-action: none; 
            background-color: #f8fafc; 
            box-shadow: 0 30px 60px rgba(0,0,0,0.7); 
            border-radius: 12px;
            max-width: 100vw;
            max-height: 100vh;
        }
    </style>
    <script src="../vendor/gettext.min.js"></script>
    <script src="./gettext-vi.js"></script>
    <script src="../vendor/createjs-2015.11.26.min.js"></script>
    <script src="../vendor/compo.min.js"></script>
    <script src="./fertilization.js"></script>
    <script>
    var canvas, stage, exportRoot, images, ss;

    function init() {
        canvas = document.getElementById("canvas");
        createjs.LoadItem.LOAD_TIMEOUT_DEFAULT = 120 * 1000;
        createjs.MotionGuidePlugin.install();

        if (lib.properties.manifest && lib.properties.manifest.length) {
            images = images || {};
            ss = ss || {};
            var loader = new createjs.LoadQueue(false);
            loader.addEventListener("fileload", handleFileLoad);
            loader.addEventListener("complete", handleComplete);
            loader.loadManifest(lib.properties.manifest);
        } else {
            handleComplete();
        }
    }

    function handleFileLoad(evt) {
        if (evt.item.type == "image") {
            images[evt.item.id] = evt.result;
        }
    }

    function handleComplete(evt) {
        if (evt) {
            var queue = evt.target;
            var ssMetadata = lib.ssMetadata;
            for (var i = 0; i < ssMetadata.length; i++) {
                ss[ssMetadata[i].name] = new createjs.SpriteSheet({
                    "images": [queue.getResult(ssMetadata[i].name)],
                    "frames": ssMetadata[i].frames
                })
            }
        }

        exportRoot = new lib._119();
        stage = new createjs.Stage(canvas);
        
        var bg = new createjs.Shape();
        bg.graphics.beginFill('#f8fafc').drawRect(0, 0, lib.properties.width, lib.properties.height);
        exportRoot.addChildAt(bg, 0);
        bg.on('tick', function() {
            if (exportRoot.getChildIndex(bg) != 0) exportRoot.setChildIndex(bg, 0);
        });
        
        function cleanFooter() {
            var count = 0;
            function processContainer(container, path) {
                if (!container) return;
                path = path || 'stage';
                
                var name = container.name || container.toString();
                console.log('CreateJS Object:', path + ' -> ' + name + ' [y=' + container.y + ']');
                
                var isFooter = false;
                if (name === 'EMLogo' || name.toLowerCase().indexOf('virtuallab') !== -1 || 
                    name.toLowerCase().indexOf('footer') !== -1 || name.toLowerCase().indexOf('copyright') !== -1) {
                    isFooter = true;
                }
                
                if (isFooter) {
                    container.visible = false;
                    return;
                }
                
                if (container.numChildren) {
                    for (var i = 0; i < container.numChildren; i++) {
                        processContainer(container.getChildAt(i), path + '.' + name);
                    }
                }
            }

            var interval = setInterval(function() {
                count++;
                if (count > 500) clearInterval(interval);
                if (stage) {
                    processContainer(stage);
                }
            }, 100);
        }

        stage.addChild(exportRoot);
        canvas.style.display = '';
        cleanFooter();
        stage.update();
        stage.enableMouseOver();

        function findNativePlayButton(container) {
            if (!container) return null;
            if (container.type === 'play' || container.type === 'playPause') return container;
            if (container.numChildren) {
                for (var i = 0; i < container.numChildren; i++) {
                    var found = findNativePlayButton(container.getChildAt(i));
                    if (found) return found;
                }
            }
            return null;
        }

        var playBtn = document.createElement('button');
        playBtn.id = 'customPlayBtn';
        playBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg><span>Bắt đầu</span>';
        playBtn.style.cssText = "position:absolute; bottom:30px; left:50%; transform:translateX(-50%); background:linear-gradient(135deg, #ec4899, #be185d); border:none; border-radius:30px; padding:12px 30px; color:white; font-family:'Segoe UI', Tahoma, sans-serif; font-size:14px; font-weight:bold; cursor:pointer; box-shadow:0 10px 25px rgba(236, 72, 153, 0.4); transition:all 0.3s ease; display:flex; align-items:center; gap:8px; z-index:10000;";
        
        playBtn.onmouseover = function() { playBtn.style.transform = 'translateX(-50%) scale(1.05)'; };
        playBtn.onmouseout = function() { playBtn.style.transform = 'translateX(-50%) scale(1)'; };

        playBtn.onclick = function() {
            var nativeBtn = findNativePlayButton(stage);
            if (nativeBtn) {
                nativeBtn.dispatchEvent(new createjs.MouseEvent("click", true, false, 0, 0, null, 0, true));
                
                var isPlaying = nativeBtn.isPlaying || nativeBtn._isPlaying;
                if (isPlaying) {
                    playBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg><span>Tạm dừng</span>';
                    playBtn.style.background = 'linear-gradient(135deg, #64748b, #475569)';
                } else {
                    playBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg><span>Tiếp tục</span>';
                    playBtn.style.background = 'linear-gradient(135deg, #ec4899, #be185d)';
                }
            } else {
                console.warn("Native play button not found via property traversal.");
            }
        };
        document.body.appendChild(playBtn);

        createjs.Ticker.setFPS(lib.properties.fps);
        createjs.Ticker.addEventListener("tick", stage);
        createjs.Touch.enable(stage);

        resize();
    }

    var resizingClassSuffix = ' u-resizing';
    var prevWidth, resizeTimeout;

    function addResizingClass() {
        if (document.body.className.indexOf(resizingClassSuffix) == -1) document.body.className += resizingClassSuffix;
    }

    function removeResizingClass() {
        document.body.className = document.body.className.replace(resizingClassSuffix, '');
    }

    function resize() {
        removeResizingClass();
        if (window.resizeTimeout) clearTimeout(window.resizeTimeout);

        window.resizeTimeout = setTimeout(function() {
            var hRatio = window.innerWidth / lib.properties.width;
            var vRatio = window.innerHeight / lib.properties.height;
            var minRatio = Math.min(hRatio, vRatio) * 1.25; 

            canvas.width = minRatio * lib.properties.width;
            canvas.height = minRatio * (lib.properties.height - 45); 
            exportRoot.scaleX = exportRoot.scaleY = minRatio;
            stage.update();

            document.body.dispatchEvent(new Event("AfterResize"));
        }, 10);
    }

    if (window.addEventListener) window.addEventListener('orientationchange', function() {
        addResizingClass();
        setTimeout(resize, 1000);
    });
</script>
</head>
<body onload="init();" onresize="resize()">
    <canvas id="canvas" width="550" height="440" style="display: none;"></canvas>
</body>
</html>
