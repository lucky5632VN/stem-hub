<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Thí nghiệm của Mendel (lai hai tính trạng)</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
    html, body {
        margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; 
        background: #000000; display: flex; align-items: center; justify-content: center;
    } 
    #canvas-container {
        position: relative;
        overflow: hidden;
        box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        border-radius: 12px;
        background: #000;
    }
    canvas {
        display: block;
    }
</style>
</head>
<body onload="init();">
    <div id="canvas-container">
        <canvas id="canvas" width="550" height="440" style="display: none;"></canvas>
    </div>

    <script src="../vendor/gettext.min.js"></script>
    <script src="./gettext-vi.js"></script>
    <script src="../vendor/createjs-2015.11.26.min.js"></script>
    <script src="../vendor/compo.min.js"></script>
    <script src="./mendels-experiment-di-hybridism.js"></script>

    <script>
    var canvas, stage, exportRoot, images, ss;
    window.images = images = images || {};
    window.ss = ss = ss || {};

    function init() {
        canvas = document.getElementById("canvas");
        createjs.LoadItem.LOAD_TIMEOUT_DEFAULT = 120 * 1000;

        // Ensure lib is available from the script
        if (window.lib && lib.properties && lib.properties.manifest && lib.properties.manifest.length > 0) {
            var loader = new createjs.LoadQueue(false);
            loader.addEventListener("fileload", handleFileLoad);
            loader.addEventListener("complete", handleComplete);
            loader.loadManifest(lib.properties.manifest);
        } else {
            handleComplete();
        }
    }

    function handleFileLoad(evt) {
        if (evt.item.type == "image") { images[evt.item.id] = evt.result; }
    }

    function handleComplete(evt) {
        if (evt) {
            var queue = evt.target;
            var ssMetadata = lib.ssMetadata;
            if (ssMetadata) {
                for (var i = 0; i < ssMetadata.length; i++) {
                    ss[ssMetadata[i].name] = new createjs.SpriteSheet({
                        "images": [queue.getResult(ssMetadata[i].name)],
                        "frames": ssMetadata[i].frames
                    });
                }
            }
        }

        try {
            if (!window.lib || !lib._452) {
                console.error("Critical: lib._452 not found. Retrying in 100ms...");
                setTimeout(handleComplete, 100);
                return;
            }
            
            exportRoot = new lib._452();
            stage = new createjs.Stage(canvas);
            
            var bg = new createjs.Shape();
            bg.graphics.beginFill('black').drawRect(0, 0, lib.properties.width, lib.properties.height);
            exportRoot.addChildAt(bg, 0);
            bg.on('tick', function() {
                if (exportRoot.getChildIndex(bg) != 0) exportRoot.setChildIndex(bg, 0);
            });
            
            stage.addChild(exportRoot);
            canvas.style.display = 'block';
            
            createjs.Ticker.setFPS(lib.properties.fps || 24);
            createjs.Ticker.addEventListener("tick", stage);
            createjs.Touch.enable(stage);
            
            resize();
            stage.update();
            
        } catch (err) {
            console.error("Error during handleComplete:", err);
        }
    }

    function resize() {
        if (!exportRoot || !lib) return;
        
        var w = window.innerWidth;
        var h = window.innerHeight;
        
        var hRatio = w / lib.properties.width;
        var vRatio = h / lib.properties.height; 
        var minRatio = Math.min(hRatio, vRatio) * 1.15; 

        var container = document.getElementById('canvas-container');
        var visibleHeight = lib.properties.height - 45;
        
        container.style.width = (minRatio * lib.properties.width) + "px";
        container.style.height = (minRatio * visibleHeight) + "px";

        canvas.width = minRatio * lib.properties.width;
        canvas.height = minRatio * lib.properties.height;
        
        canvas.style.marginTop = "-" + (minRatio * 2) + "px";
        
        exportRoot.scaleX = exportRoot.scaleY = minRatio;
        
        if (stage) stage.update();
    }

    window.addEventListener('resize', resize);
    </script>
</body>
</html>
